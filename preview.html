<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GELD</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #050505;
  color: #e8e6e1;
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* noise */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: url('https://www.transparenttextures.com/patterns/noise.png');
  opacity: 0.05;
}

/* cursor */
#cur, #ring {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

#cur {
  width: 6px;
  height: 6px;
  background: #b89b6a;
  z-index: 9999;
}

#ring {
  width: 42px;
  height: 42px;
  border: 1px solid rgba(184,155,106,0.25);
  z-index: 9998;
}

/* sections */
section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* video */
video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.18;
  filter: contrast(1.1) saturate(0.8);
}

/* typography */
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(70px, 12vw, 180px);
  letter-spacing: 0.12em;
  margin: 0;
}

p {
  opacity: 0.5;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  font-size: 11px;
}

.content {
  transform: translateY(60px);
  opacity: 0;
}

/* button */
.btn {
  margin-top: 40px;
  padding: 16px 46px;
  border: 1px solid rgba(184,155,106,0.25);
  color: #e8e6e1;
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 0.35em;
  display: inline-block;
  transition: .4s;
}

.btn:hover {
  border-color: rgba(184,155,106,0.7);
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div id="cur"></div>
<div id="ring"></div>

<!-- HERO -->
<section class="panel">
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-aerial-view-of-city-at-night-5777/1080p.mp4">
  </video>

  <div class="content">
    <h1>GELD</h1>
    <p>Access changes perception</p>
    <a class="btn" href="https://discord.gg/XQjuCmYg">Enter the signal</a>
  </div>
</section>

<!-- SECTION 2 -->
<section class="panel">
  <div class="content">
    <h1 style="font-size:64px;">Some watch.</h1>
    <p>Others enter</p>
  </div>
</section>

<!-- SECTION 3 -->
<section class="panel">
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-dark-corridor-7913/1080p.mp4">
  </video>

  <div class="content">
    <h1 style="font-size:64px;">Silence is structure</h1>
    <p>The signal refines itself</p>
  </div>
</section>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
/* CURSOR */
const cur = document.getElementById('cur');
const ring = document.getElementById('ring');

let x = 0, y = 0;
let rx = 0, ry = 0;

document.addEventListener('mousemove', (e) => {
  x = e.clientX;
  y = e.clientY;

  cur.style.left = x + 'px';
  cur.style.top = y + 'px';
});

function animate() {
  rx += (x - rx) * 0.12;
  ry += (y - ry) * 0.12;

  ring.style.left = rx + 'px';
  ring.style.top = ry + 'px';

  requestAnimationFrame(animate);
}
animate();

/* GSAP SCROLL CINEMATIC */
gsap.registerPlugin(ScrollTrigger);

gsap.utils.toArray(".content").forEach(el => {
  gsap.to(el, {
    y: 0,
    opacity: 1,
    duration: 1.6,
    ease: "power3.out",
    scrollTrigger: {
      trigger: el,
      start: "top 80%",
      toggleActions: "play none none reverse"
    }
  });
});

/* parallax video subtle */
gsap.utils.toArray("video").forEach(video => {
  gsap.to(video, {
    y: 80,
    ease: "none",
    scrollTrigger: {
      trigger: video,
      scrub: true
    }
  });
});

/* luxury hover */
document.querySelectorAll('a').forEach(el => {
  el.addEventListener('mouseenter', () => {
    ring.style.transform = 'translate(-50%, -50%) scale(1.8)';
    ring.style.borderColor = 'rgba(184,155,106,0.7)';
  });

  el.addEventListener('mouseleave', () => {
    ring.style.transform = 'translate(-50%, -50%) scale(1)';
    ring.style.borderColor = 'rgba(184,155,106,0.25)';
  });
});
</script>

</body>
</html>
