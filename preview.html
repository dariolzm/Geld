<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GELD</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #040404;
  color: #e8e6e1;
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* cursor */
#cur, #ring {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

#cur {
  width: 6px;
  height: 6px;
  background: #9a8060;
  z-index: 9999;
}

#ring {
  width: 36px;
  height: 36px;
  border: 1px solid rgba(154,128,96,0.3);
  z-index: 9998;
}

/* layout */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px;
  position: relative;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(80px, 18vw, 200px);
  letter-spacing: 0.1em;
  margin: 0;
}

p {
  opacity: 0.6;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  font-size: 12px;
}

.btn {
  margin-top: 40px;
  padding: 18px 50px;
  border: 1px solid rgba(154,128,96,0.3);
  text-decoration: none;
  color: #e8e6e1;
  letter-spacing: 0.4em;
  font-size: 10px;
  display: inline-block;
}
.btn:hover {
  border-color: rgba(154,128,96,0.7);
}

/* video */
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.15;
  z-index: -1;
}
</style>
</head>

<body>

<div id="cur"></div>
<div id="ring"></div>

<section>
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-aerial-view-of-city-at-night-5777/1080p.mp4">
  </video>

  <div>
    <h1>GELD</h1>
    <p>Access Changes Everything</p>
    <a class="btn" href="https://discord.gg/XQjuCmYg" target="_blank">
      Enter The Signal
    </a>
  </div>
</section>

<section>
  <div>
    <h1 style="font-size:60px;">Some watch.</h1>
    <p>Others enter</p>
  </div>
</section>

<section>
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-dark-corridor-7913/1080p.mp4">
  </video>

  <div>
    <h1 style="font-size:60px;">Silence is power</h1>
    <p>The signal grows</p>
  </div>
</section>

<script>
const cur = document.getElementById('cur');
const ring = document.getElementById('ring');

let x = 0, y = 0;
let rx = 0, ry = 0;

document.addEventListener('mousemove', (e) => {
  x = e.clientX;
  y = e.clientY;

  cur.style.left = x + 'px';
  cur.style.top = y + 'px';
});

function animate() {
  rx += (x - rx) * 0.1;
  ry += (y - ry) * 0.1;

  ring.style.left = rx + 'px';
  ring.style.top = ry + 'px';

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
