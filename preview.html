<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GELD</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #050505;
  color: #e8e6e1;
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* NOISE (luxury essential) */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: url('https://www.transparenttextures.com/patterns/noise.png');
  opacity: 0.06;
  mix-blend-mode: overlay;
}

/* CURSOR */
#cur, #ring {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

#cur {
  width: 6px;
  height: 6px;
  background: #b89b6a;
  z-index: 9999;
}

#ring {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(184,155,106,0.25);
  z-index: 9998;
  transition: transform .2s ease, border-color .3s ease;
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  padding: 60px;
  overflow: hidden;
}

/* TYPOGRAPHY */
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(70px, 12vw, 180px);
  letter-spacing: 0.12em;
  margin: 0;
  opacity: 0;
  transform: translateY(40px);
  animation: fadeUp 1.4s ease forwards;
}

p {
  opacity: 0.5;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  font-size: 11px;
  margin-top: 20px;
  opacity: 0;
  animation: fadeUp 1.6s ease forwards;
}

/* BUTTON */
.btn {
  margin-top: 50px;
  padding: 16px 46px;
  border: 1px solid rgba(184,155,106,0.25);
  text-decoration: none;
  color: #e8e6e1;
  letter-spacing: 0.35em;
  font-size: 10px;
  display: inline-block;
  transition: all .4s ease;
  opacity: 0;
  animation: fadeUp 1.8s ease forwards;
}

.btn:hover {
  border-color: rgba(184,155,106,0.7);
  transform: translateY(-2px);
}

/* VIDEO */
video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.18;
  filter: contrast(1.1) saturate(0.8);
}

/* FADE */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* SMALL TEXT BLOCK */
.sub {
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.8;
}

/* MOBILE */
@media (hover:none){
  #cur, #ring { display:none; }
  body { cursor:auto; }
}
</style>
</head>

<body>

<div id="cur"></div>
<div id="ring"></div>

<!-- HERO -->
<section>
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-aerial-view-of-city-at-night-5777/1080p.mp4">
  </video>

  <div>
    <h1>GELD</h1>
    <p>Access changes perception</p>
    <a class="btn" href="https://discord.gg/XQjuCmYg" target="_blank">Enter the signal</a>
  </div>
</section>

<!-- SECTION 2 -->
<section>
  <div class="sub">
    <h1 style="font-size:64px;">Some watch.</h1>
    <p>Others enter</p>
  </div>
</section>

<!-- SECTION 3 -->
<section>
  <video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-dark-corridor-7913/1080p.mp4">
  </video>

  <div class="sub">
    <h1 style="font-size:64px;">Silence is structure</h1>
    <p>The signal refines itself</p>
  </div>
</section>

<script>
const cur = document.getElementById('cur');
const ring = document.getElementById('ring');

let x = 0, y = 0;
let rx = 0, ry = 0;

/* cursor */
document.addEventListener('mousemove', (e) => {
  x = e.clientX;
  y = e.clientY;

  cur.style.left = x + 'px';
  cur.style.top = y + 'px';
});

function animate() {
  rx += (x - rx) * 0.12;
  ry += (y - ry) * 0.12;

  ring.style.left = rx + 'px';
  ring.style.top = ry + 'px';

  requestAnimationFrame(animate);
}
animate();

/* luxury hover interaction */
document.querySelectorAll('a').forEach(el => {
  el.addEventListener('mouseenter', () => {
    ring.style.transform = 'translate(-50%, -50%) scale(1.7)';
    ring.style.borderColor = 'rgba(184,155,106,0.7)';
  });

  el.addEventListener('mouseleave', () => {
    ring.style.transform = 'translate(-50%, -50%) scale(1)';
    ring.style.borderColor = 'rgba(184,155,106,0.25)';
  });
});
</script>

</body>
</html>
